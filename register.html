<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Сервис рациональных решений</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-left-content animate-in">
        <h2>Сервис принятия рациональных решений</h2>
        <p>Создайте аккаунт, чтобы сохранять решения, создавать голосования и получать аналитику по результатам.</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-box animate-in delay-1">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">
          <a href="index.html" class="back-link" style="margin:0;">&larr; На главную</a>
          <button class="theme-toggle" id="themeToggle" title="Сменить тему">&#9790;</button>
        </div>
        <h1>Регистрация</h1>
        <p class="sub">Заполните форму, чтобы создать аккаунт</p>

        <form class="auth-form" id="registerForm" action="#" method="post">
          <div class="field-row">
            <div class="field">
              <label for="lastName">Фамилия</label>
              <input type="text" id="lastName" name="lastName" placeholder="Иванов" required>
            </div>
            <div class="field">
              <label for="firstName">Имя</label>
              <input type="text" id="firstName" name="firstName" placeholder="Иван" required>
            </div>
          </div>
          <div class="field">
            <label for="birthdate">Дата рождения</label>
            <input type="date" id="birthdate" name="birthdate" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Не менее 6 символов" minlength="6" required>
          </div>
          <div class="field">
            <label for="confirmPassword">Подтверждение пароля</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <p class="error-msg" id="passwordError" style="display:none;">Пароли не совпадают</p>
          </div>

          <div class="checkbox-group">
            <label class="auth-checkbox">
              <input type="checkbox" id="agreePd" name="agreePd" required>
              <span>Я даю согласие на обработку моих персональных данных в соответствии с <a href="privacy.html">Политикой конфиденциальности</a> и Федеральным законом от 27.07.2006 №&nbsp;152&#8209;ФЗ «О&nbsp;персональных данных».</span>
            </label>
            <label class="auth-checkbox">
              <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
              <span>Я ознакомлен(а) и согласен(на) с <a href="terms.html">Пользовательским соглашением</a>.</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Зарегистрироваться</button>
        </form>

        <div class="oauth-divider">или через</div>
        <div class="oauth-buttons">
          <a href="/auth/yandex" class="btn-oauth yandex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#FC3F1D"/><path d="M13.32 7.666h-.924c-1.694 0-2.585.858-2.585 2.123 0 1.43.616 2.1 1.881 2.959l1.045.704-3.003 4.548H7.49l2.695-4.076c-1.54-1.1-2.398-2.244-2.398-3.946 0-2.376 1.65-3.924 4.478-3.924h2.31V18h-1.254V7.666z" fill="#fff"/></svg>Яндекс ID</a>
          <a href="/auth/telegram" class="btn-oauth telegram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#27A7E7"/><path d="M7.53 11.63c2.78-1.21 4.64-2.01 5.57-2.4 2.65-1.1 3.2-1.3 3.56-1.3.08 0 .26.02.37.11.1.08.12.18.14.26.01.08.03.24.01.37-.2 2.12-.99 7.27-1.4 9.65-.17 1-.51 1.34-.84 1.37-.72.07-1.26-.47-1.95-.93-1.09-.71-1.7-1.16-2.75-1.85-1.22-.8-.43-1.24.27-1.96.18-.19 3.36-3.08 3.42-3.34.01-.03.01-.15-.06-.21-.07-.06-.17-.04-.25-.02-.1.02-1.8 1.14-5.08 3.36-.48.33-.92.49-1.31.48-.43-.01-1.26-.24-1.88-.44-.76-.25-1.36-.38-1.31-.8.03-.22.33-.45.91-.68z" fill="#fff"/></svg>Telegram</a>
          <a href="/auth/google" class="btn-oauth google"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09A6.97 6.97 0 0 1 5.47 12c0-.72.13-1.43.37-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Google</a>
        </div>

        <p class="auth-footer-text">
          Уже есть аккаунт? <a href="index.html">Войти</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/main.js?v=4"></script>
  <script>
    if (window.location.protocol === 'file:') {
      var el = document.querySelector('.auth-box');
      if (el) el.insertAdjacentHTML('afterbegin', '<p style="color:#b91c1c;margin-bottom:1rem;">Откройте через сервер: <a href="http://localhost:5000/register.html">http://localhost:5000/register.html<\/a><\/p>');
    }
    (function() {
      var params = new URLSearchParams(window.location.search);
      var form = document.getElementById('registerForm');
      var pass = document.getElementById('password');
      var confirm = document.getElementById('confirmPassword');
      var agreePd = document.getElementById('agreePd');
      var agreeTerms = document.getElementById('agreeTerms');
      var firstName = document.getElementById('firstName');
      var lastName = document.getElementById('lastName');
      var birthdate = document.getElementById('birthdate');
      var emailField = document.getElementById('email');
      var submitBtn = document.getElementById('submitBtn');
      var passwordError = document.getElementById('passwordError');

      if (params.get('firstName')) firstName.value = params.get('firstName');
      if (params.get('lastName')) lastName.value = params.get('lastName');
      if (params.get('email')) emailField.value = params.get('email');
      if (params.get('birthdate')) birthdate.value = params.get('birthdate');
      if (params.get('oauth')) {
        var provider = params.get('oauth');
        var names = {yandex: 'Яндекс ID', vk: 'VK ID', google: 'Google'};
        form.insertAdjacentHTML('beforebegin',
          '<div style="background:var(--primary-50);border:1px solid var(--primary-100);border-radius:0.75rem;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.875rem;color:var(--text);">' +
          'Данные получены через <strong>' + (names[provider] || provider) + '<\/strong>. Проверьте, задайте пароль и подтвердите согласия.<\/div>');
        var oauthDiv = document.querySelector('.oauth-divider');
        var oauthBtns = document.querySelector('.oauth-buttons');
        if (oauthDiv) oauthDiv.style.display = 'none';
        if (oauthBtns) oauthBtns.style.display = 'none';
      }

      function check() {
        var same = pass.value && pass.value === confirm.value;
        passwordError.style.display = (pass.value && confirm.value && !same) ? 'block' : 'none';
        submitBtn.disabled = !(
          agreePd.checked && agreeTerms.checked && same &&
          pass.value.length >= 6 && firstName.value.trim() &&
          lastName.value.trim() && birthdate.value
        );
      }

      [pass, confirm, agreePd, agreeTerms, firstName, lastName, birthdate].forEach(function(el) {
        el.addEventListener('input', check);
        el.addEventListener('change', check);
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Регистрация...';

        apiPost('/api/register', {
          email: document.getElementById('email').value,
          password: pass.value,
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          birthdate: birthdate.value,
          agreePd: agreePd.checked,
          agreeTerms: agreeTerms.checked
        }).then(function(res) {
          if (res.data.ok) {
            window.location.href = 'feed.html';
          } else {
            showToast(res.data.error || 'Ошибка регистрации');
            submitBtn.textContent = 'Зарегистрироваться';
            check();
          }
        }).catch(function() {
          showToast('Ошибка соединения с сервером');
          submitBtn.textContent = 'Зарегистрироваться';
          check();
        });
      });
    })();
  </script>
</body>
</html>
