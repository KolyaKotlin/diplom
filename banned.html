<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аккаунт заблокирован</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .banned-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-page);
      padding: 1rem;
    }
    .banned-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 28rem;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .banned-icon {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: #fef2f2;
      color: #dc2626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.25rem;
    }
    [data-theme="dark"] .banned-icon {
      background: rgba(220,38,38,0.15);
    }
    .banned-card h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .banned-card .sub {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .banned-form textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      transition: border-color 0.2s;
    }
    .banned-form textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .banned-form .field {
      margin-bottom: 1rem;
      text-align: left;
    }
    .banned-form label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }
    .banned-form input[type="email"] {
      width: 100%;
      padding: 0.625rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s;
    }
    .banned-form input[type="email"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    .banned-success {
      color: #16a34a;
      font-weight: 600;
      font-size: 0.9375rem;
      margin-top: 1rem;
      display: none;
    }
    .banned-links {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
    }
    .banned-links a {
      color: var(--primary);
      text-decoration: none;
    }
    .banned-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="banned-page">
    <div class="banned-card">
      <div class="banned-icon">&#9888;</div>
      <h1>Аккаунт заблокирован</h1>
      <p class="sub">
        Ваш аккаунт был заблокирован за нарушение правил сообщества.
        Если вы считаете, что это ошибка, напишите нам — мы рассмотрим вашу заявку.
      </p>

      <form class="banned-form" id="feedbackForm">
        <div class="field">
          <label for="feedbackEmail">Email для связи</label>
          <input type="email" id="feedbackEmail" placeholder="your@email.com">
        </div>
        <div class="field">
          <label for="feedbackText">Сообщение</label>
          <textarea id="feedbackText" placeholder="Опишите ситуацию или попросите о разблокировке…"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="feedbackBtn">Отправить</button>
      </form>
      <div class="banned-success" id="feedbackSuccess">Сообщение отправлено. Мы свяжемся с вами.</div>

      <div class="banned-links">
        <a href="index.html">&larr; На главную</a>
      </div>
    </div>
  </div>

  <script src="js/main.js?v=4"></script>
  <script>
    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('feedbackBtn');
      var text = document.getElementById('feedbackText').value.trim();
      var email = document.getElementById('feedbackEmail').value.trim();
      if (!text) { alert('Введите сообщение'); return; }
      btn.disabled = true;
      btn.textContent = 'Отправка…';
      fetch('/api/feedback', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: text, email: email})
      }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); }).then(function(r) {
        var d = r.data;
        if (d.error) {
          alert(d.error);
          btn.disabled = false;
          btn.textContent = 'Отправить';
        } else {
          document.getElementById('feedbackForm').style.display = 'none';
          document.getElementById('feedbackSuccess').style.display = 'block';
        }
      }).catch(function() {
        alert('Ошибка соединения');
        btn.disabled = false;
        btn.textContent = 'Отправить';
      });
    });
  </script>
</body>
</html>
